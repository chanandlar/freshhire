spring.application.name=freshhire

# Elasticsearch
elasticsearch.host=localhost
elasticsearch.port=9200
elasticsearch.index=jobs

# Adzuna
adzuna.app-id=YOUR_APP_ID
adzuna.app-key=YOUR_APP_KEY
adzuna.base-url=https://api.adzuna.com/v1/api/jobs
adzuna.countries=us,in
adzuna.max-calls-per-poll=31
adzuna.page-size=50
# runs every 6 hours (00:00, 06:00, 12:00, 18:00)
adzuna.poll-cron=0 0 */6 * * *

# Job TTL
job.ttl-days=7
# runs daily at midnight
job.cleanup-cron=0 0 0 * * *
